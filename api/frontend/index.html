<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <title>VultrPilot</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#111a2e; --muted:#91a0ba; --text:#eef3ff; --accent:#6d8cff; --line:#253354; }
    * { box-sizing:border-box; }
    body { margin:0; height:100vh; overflow:hidden; background:radial-gradient(circle at 50% -10%, #1c2c59 0, var(--bg) 42%); color:var(--text); font:15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, sans-serif; }
    .shell { width:100%; height:100vh; margin:auto; display:flex; flex-direction:column; padding:18px 24px 18px; }
    header { position:sticky; top:0; z-index:10; flex:none; display:flex; align-items:center; justify-content:space-between; padding:4px 4px 24px; background:linear-gradient(var(--bg) 78%, transparent); }
    .brand { display:flex; align-items:center; gap:12px; font-weight:700; font-size:20px; letter-spacing:.2px; }
    .logo { width:34px; height:34px; border-radius:11px; display:grid; place-items:center; background:linear-gradient(135deg,#7b91ff,#4e60cb); box-shadow:0 8px 30px #526ce855; }
    .header-actions { display:flex; align-items:center; gap:14px; }
    .approval-mode { padding:6px 8px; border:1px solid var(--line); border-radius:8px; color:var(--text); background:#15223c; font-size:11px; }
    .status { color:#9de7bc; font-size:12px; display:flex; align-items:center; gap:7px; }
    .clear { min-width:auto; padding:6px 10px; border:1px solid var(--line); border-radius:8px; color:var(--muted); background:transparent; font-size:11px; font-weight:500; }
    .clear:hover { color:var(--text); border-color:var(--accent); }
    .history { margin:0 0 10px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:rgba(17,26,46,.62); }
    .history-title { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px; }
    #history-list { display:flex; gap:7px; overflow-x:auto; }
    .history-item { flex:0 0 auto; max-width:260px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:#0d172a; color:#cbd6ef; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .history-empty { color:#6f7d98; font-size:12px; }
    .dot { width:7px; height:7px; border-radius:50%; background:#63d995; box-shadow:0 0 12px #63d995; }
    .workspace { --chat-width:58%; flex:1; min-height:0; display:grid; grid-template-columns:minmax(360px,var(--chat-width)) 8px minmax(320px,1fr); gap:0; width:100%; }
    main { min-width:0; min-height:0; display:flex; flex-direction:column; justify-content:flex-end; padding-right:12px; }
    .splitter { position:relative; cursor:col-resize; border-left:1px solid #33456f; border-right:1px solid #33456f; background:#131e36; }
    .splitter::after { content:'⋮'; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#8fa0c5; font-size:18px; }
    .splitter:hover, .splitter.dragging { background:#263b6c; border-color:#6d8cff; }
    #browser-sidebar { min-width:0; min-height:0; overflow-y:auto; padding:16px; border:1px solid var(--line); border-radius:16px; background:rgba(12,20,38,.72); scrollbar-width:thin; scrollbar-color:#40558b transparent; }
    .sidebar-empty { display:grid; place-items:center; min-height:220px; padding:24px; text-align:center; color:var(--muted); font-size:13px; }
    .sidebar-title { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--text); font-weight:700; }
    .sidebar-live { color:#9de7bc; font-size:11px; font-weight:500; }
    .sidebar-url { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #browser-sidebar .sidebar-browser { height:auto; display:flex; flex-direction:column; }
    #browser-sidebar .annotated-frame { display:block; height:auto; margin-top:12px; overflow:visible; }
    #browser-sidebar .annotation-tools { position:sticky; top:0; z-index:4; background:#252b35; box-shadow:0 5px 12px #080d19aa; }
    #browser-sidebar .annotation-stage { width:100%; height:auto; max-height:none; overflow:visible; }
    #browser-sidebar .annotation-stage img { display:block; width:100%; height:auto; max-width:100%; object-fit:initial; }
    #browser-sidebar .annotation-stage canvas { width:100%; height:100%; }
    #browser-sidebar .annotation-tools { overflow-x:auto; }
    #messages { flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:18px; padding:24px 8px 24px 0; scrollbar-width:thin; scrollbar-color:#40558b transparent; }
    .empty { text-align:center; margin:auto; padding:90px 0 50px; color:var(--muted); }
    .empty h1 { color:var(--text); font-size:34px; margin:0 0 8px; }
    .empty p { margin:0; }
    .message { display:flex; gap:12px; max-width:88%; animation:rise .2s ease-out; }
    .message.user { margin-left:auto; flex-direction:row-reverse; }
    .avatar { flex:none; width:30px; height:30px; border-radius:10px; display:grid; place-items:center; background:#1d2a49; color:#aebdff; font-size:13px; font-weight:700; }
    .user .avatar { background:#3047a4; color:white; }
    .bubble { padding:11px 14px; border:1px solid var(--line); border-radius:15px; background:rgba(17,26,46,.88); white-space:pre-wrap; overflow-wrap:anywhere; }
    .bubble p { margin:0 0 10px; } .bubble p:last-child { margin-bottom:0; }
    .bubble h1,.bubble h2,.bubble h3 { margin:0 0 8px; line-height:1.25; } .bubble h1 { font-size:20px; } .bubble h2 { font-size:18px; } .bubble h3 { font-size:16px; }
    .bubble ul { margin:0 0 10px; padding-left:22px; } .bubble li { margin:3px 0; }
    .bubble table { width:100%; border-collapse:collapse; margin:8px 0 10px; font-size:13px; display:block; overflow-x:auto; }
    .bubble th,.bubble td { padding:8px 10px; border:1px solid var(--line); text-align:left; vertical-align:top; min-width:120px; }
    .bubble th { background:#1a2743; color:#e5ebff; font-weight:700; white-space:nowrap; }
    .bubble td { background:#0d172a; }
    .bubble code { padding:2px 5px; border-radius:5px; background:#0a1122; color:#d4ddff; font:13px ui-monospace,SFMono-Regular,Consolas,monospace; }
    .bubble pre { margin:8px 0 0; padding:11px; overflow:auto; border-radius:8px; background:#080d19; border:1px solid var(--line); white-space:pre; }
    .bubble pre code { padding:0; background:none; } .bubble a { color:#aebdff; text-decoration:underline; }
    .chat-image { display:block; width:100%; max-height:440px; object-fit:contain; border-radius:8px; background:#fff; }
    .message-remove { position:absolute; top:6px; right:6px; z-index:2; min-width:24px; width:24px; height:24px; padding:0; border:0; border-radius:50%; color:#fff; background:#17213acc; font-size:18px; line-height:22px; }
    .user .bubble { background:#263b92; border-color:#4058bd; }
    .meta { color:var(--muted); font-size:11px; margin:6px 2px 0; }
    .event { margin:0 0 0 42px; padding:12px; border:1px solid #294163; border-radius:12px; background:#0d172a; color:#b9c9e7; font-size:13px; }
    .thinking { color:#b9c9e7; } .thinking::after { content:' '; display:inline-block; width:18px; animation:dots 1.2s steps(4,end) infinite; }
    .event strong { color:#dce6ff; }
    .event p { margin:8px 0 0; line-height:1.55; }
    .event h1,.event h2,.event h3 { margin:8px 0 6px; color:#e5ebff; line-height:1.25; }
    .event h1 { font-size:19px; } .event h2 { font-size:17px; } .event h3 { font-size:15px; }
    .event ul { margin:8px 0 0; padding-left:22px; }
    .event li { margin:3px 0; }
    .event code { padding:2px 5px; border-radius:5px; background:#080d19; color:#d4ddff; }
    .event a { color:#aebdff; text-decoration:underline; }
    .approval-request { border-color:#6d8cff; background:linear-gradient(180deg,#17264a,#0d172a); }
    .approval-request p { margin:8px 0 4px; color:var(--text); }
    .approval-actions { display:flex; gap:8px; margin-top:12px; }
    .approval-actions button { min-width:auto; padding:8px 12px; border-radius:8px; }
    .approval-actions .deny { background:#3b2638; color:#ffc4d2; }
    .event img { display:block; width:100%; max-height:360px; object-fit:contain; margin-top:10px; border-radius:8px; border:1px solid var(--line); background:#fff; }
    .annotation-stage { position:relative; margin-top:10px; width:100%; max-height:440px; overflow:auto; border-radius:8px; background:#fff; }
    .annotation-stage img { display:block; width:100%; max-height:none; margin:0; border:0; border-radius:0; }
    .annotation-stage canvas { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; touch-action:none; }
    .annotation-tools { display:flex; align-items:stretch; gap:2px; margin-top:10px; padding:4px; overflow-x:auto; border:1px solid #3b4350; border-radius:13px; background:#252b35; scrollbar-width:thin; }
    .annotation-tools button { display:flex; flex:0 0 auto; min-width:64px; min-height:54px; align-items:center; justify-content:center; flex-direction:column; gap:3px; align-self:auto; padding:5px 8px; border:0; border-radius:9px; color:#d4d9e2; background:transparent; font-size:10px; font-weight:500; white-space:nowrap; }
    .annotation-tools button:hover { background:#343c49; color:#fff; }
    .annotation-tools button.active { color:#fff; background:#3b4657; box-shadow:inset 0 -2px #9bb0ff; }
    .annotation-tools .tool-icon { display:block; height:25px; color:#e8ecf4; font-size:24px; line-height:24px; font-weight:300; }
    .annotation-tools .tool-label { display:block; line-height:14px; }
    .annotation-options { display:flex; align-items:center; flex-wrap:wrap; gap:5px; padding:4px 7px; border-right:1px solid #454d5a; }
    .color-swatch { width:18px !important; min-width:18px !important; height:18px !important; min-height:18px !important; padding:0 !important; border:2px solid #687384 !important; border-radius:50% !important; }
    .color-swatch.active { border-color:#fff !important; box-shadow:0 0 0 2px #8ea4ff !important; }
    .annotation-font-size { width:48px; padding:4px; border:1px solid #596477; border-radius:6px; color:#e8ecf4; background:#343c49; font-size:10px; }
    .annotation-zoom { display:flex; align-items:center; gap:3px; margin-left:2px; padding-left:6px; border-left:1px solid #454d5a; }
    .annotation-zoom button { min-width:24px !important; width:24px; height:24px; min-height:24px !important; padding:0 !important; border:1px solid #596477 !important; border-radius:5px !important; color:#e8ecf4 !important; background:#343c49 !important; font-size:13px !important; }
    .annotation-zoom button:hover { background:#52617b !important; }
    .annotation-zoom span { min-width:38px; color:#cbd6ef; font-size:10px; text-align:center; }
    .annotation-text-editor { position:absolute; z-index:3; min-width:100px; padding:4px 6px; border:2px solid #91a7ff; border-radius:5px; outline:none; color:#111827; background:#fff; font:16px sans-serif; }
    .annotation-tools .annotation-undo { margin-left:0; }
    .annotation-tools .annotation-add { margin-left:auto; }
    .annotation-tools .annotation-add { color:#171717; background:#ffd400; box-shadow:0 2px 0 #b99b00; }
    .annotation-tools .annotation-add:hover { color:#111; background:#ffe45c; }
    .annotation-tools .annotation-add .tool-icon { color:#111; }
    .annotation-tools .annotation-add.active { color:#111; background:#ffd400; box-shadow:0 2px 0 #b99b00; }
    .console { margin-top:10px; padding:10px; max-height:220px; overflow:auto; border:1px solid var(--line); border-radius:8px; background:#070b14; color:#b8f2c8; font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre-wrap; }
    form { display:flex; gap:10px; padding-top:12px; }
    .attach { min-width:auto; align-self:stretch; padding:0 12px; border:1px solid var(--line); background:#15223c; color:#cbd6ef; }
    .file-list { display:flex; gap:7px; flex-wrap:wrap; padding-top:8px; }
    .approval-controls { display:flex; align-items:center; gap:8px; padding:9px 2px 0; color:var(--muted); font-size:11px; }
    .file-chip { padding:5px 9px; border:1px solid var(--line); border-radius:7px; color:#cbd6ef; background:#0d172a; font-size:11px; }
    .file-remove { margin-left:6px; padding:0 3px; min-width:auto; border:0; color:#aebdff; background:transparent; font-size:14px; line-height:1; }
    .file-attachments { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .file-preview { width:150px; max-height:150px; object-fit:cover; border:1px solid var(--line); border-radius:8px; background:#fff; }
    textarea { flex:1; min-height:52px; max-height:180px; resize:vertical; padding:14px 16px; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:15px; outline:none; font:inherit; }
    textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px #6d8cff22; }
    button { align-self:stretch; min-width:92px; border:0; border-radius:14px; color:white; background:linear-gradient(135deg,#738aff,#5268dd); font-weight:700; cursor:pointer; }
    button:disabled { opacity:.55; cursor:wait; }
    .hint { color:var(--muted); font-size:11px; text-align:center; margin-top:8px; }
    @keyframes rise { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }
    @keyframes dots { 0% { content:''; } 25% { content:'.'; } 50% { content:'..'; } 75%,100% { content:'...'; } }
    @media (max-width: 900px) {
      .workspace { display:flex; flex-direction:column; overflow-y:auto; }
      .splitter { display:none; }
      main { padding-right:0; }
      #browser-sidebar { flex:0 0 auto; min-width:0; max-height:42vh; }
      #browser-sidebar .sidebar-browser, #browser-sidebar .annotated-frame { height:auto; }
      main { min-height:58vh; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><div class="logo">✦</div><span>VultrPilot</span></div>
      <div class="header-actions"><button class="clear" id="clear" type="button">Clear chat</button><div class="status"><span class="dot"></span> Qwen online</div></div>
    </header>
    <div class="workspace">
    <main>
      <section id="messages">
        <div class="empty" id="empty"><h1>What can I browse for you?</h1><p>VultrPilot uses Qwen and an isolated browser on your Vultr VM.</p></div>
      </section>
      <form id="chat-form">
        <button class="attach" id="attach" type="button">Attach</button>
        <input id="file-picker" type="file" hidden multiple accept=".txt,.md,.csv,.json,.pdf,.png,.jpg,.jpeg,.gif,.webp" />
        <textarea id="input" placeholder="Ask VultrPilot to inspect a public webpage…" aria-label="Message"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <div class="file-list" id="file-list"></div>
      <div class="approval-controls"><span>Browser permissions:</span><select class="approval-mode" id="approval-mode" aria-label="Browser permission mode" title="Choose how VultrPilot handles browser actions"><option value="approve_once">Quick approve</option><option value="ask_before" selected>Confirm every action</option><option value="full_access">Autopilot</option></select></div>
      <div class="hint">For public pages only. Never enter passwords or payment information.</div>
    </main>
    <div class="splitter" id="splitter" role="separator" aria-label="Resize chat and browser panels" aria-orientation="vertical" tabindex="0"></div>
    <aside id="browser-sidebar" aria-label="Live isolated browser">
      <div class="sidebar-empty">The latest isolated browser screenshot will appear here.</div>
    </aside>
    </div>
  </div>
  <script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#input');
    const send = document.querySelector('#send');
    const messages = document.querySelector('#messages');
    const empty = document.querySelector('#empty');
    const clear = document.querySelector('#clear');
    const approvalMode = document.querySelector('#approval-mode');
    const attach = document.querySelector('#attach');
    const filePicker = document.querySelector('#file-picker');
    const fileList = document.querySelector('#file-list');
    const workspace = document.querySelector('.workspace');
    const splitter = document.querySelector('#splitter');
    let selectedFiles = [];
    const STORAGE_KEY = 'vultrpilot-chat-history-v1';
    const historyList = document.querySelector('#history-list');
    const sessionId = (crypto.randomUUID ? crypto.randomUUID() : `session-${Date.now()}-${Math.random().toString(16).slice(2)}`);
    let activeThinking = null;
    let liveBrowserCard = null;
    let liveBrowserFrame = null;
    let liveSocket = null;

    function setPanelWidth(value) {
      const width = Math.max(35, Math.min(75, Number(value) || 58));
      workspace.style.setProperty('--chat-width', `${width}%`);
      splitter.setAttribute('aria-valuenow', String(Math.round(width)));
    }
    setPanelWidth(localStorage.getItem('vultrpilot-chat-width') || 58);
    let resizing = false;
    splitter.addEventListener('pointerdown', event => { if (window.matchMedia('(max-width: 900px)').matches) return; resizing = true; splitter.classList.add('dragging'); splitter.setPointerCapture(event.pointerId); event.preventDefault(); });
    splitter.addEventListener('pointermove', event => { if (!resizing) return; const rect = workspace.getBoundingClientRect(); setPanelWidth(((event.clientX - rect.left) / rect.width) * 100); });
    splitter.addEventListener('pointerup', () => { if (!resizing) return; resizing = false; splitter.classList.remove('dragging'); localStorage.setItem('vultrpilot-chat-width', workspace.style.getPropertyValue('--chat-width').replace('%','')); });
    splitter.addEventListener('keydown', event => { if (event.key === 'ArrowLeft') { event.preventDefault(); setPanelWidth(parseFloat(getComputedStyle(workspace).getPropertyValue('--chat-width')) - 3); } if (event.key === 'ArrowRight') { event.preventDefault(); setPanelWidth(parseFloat(getComputedStyle(workspace).getPropertyValue('--chat-width')) + 3); } localStorage.setItem('vultrpilot-chat-width', workspace.style.getPropertyValue('--chat-width').replace('%','')); });

    function connectLiveUpdates() {
      const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
      liveSocket = new WebSocket(`${scheme}://${location.host}/ws/${sessionId}`);
      liveSocket.onmessage = event => {
        const message = JSON.parse(event.data);
        if (message.type === 'status' || message.type === 'browser_status') {
          if (activeThinking && message.data?.message) activeThinking.textContent = message.data.message;
        }
        if (message.type === 'browser_screenshot') showLiveBrowser(message.data || {});
        if (message.type === 'browser_analysis') showBrowserAnalysis(message.data || {});
        if (message.type === 'analysis') showVisionAnalysis(message.data || {});
        if (message.type === 'approval_required') showApprovalRequest(message.data || {});
        if (message.type === 'execution_output') showExecutionOutput(message.data?.chunk || '');
        if (message.type === 'browser_error' && activeThinking) activeThinking.textContent = `Browser error: ${message.data?.message || 'unknown error'}`;
      };
      liveSocket.onclose = () => setTimeout(connectLiveUpdates, 1500);
    }

    function showApprovalRequest(data) {
      const card = document.createElement('div'); card.className = 'event approval-request';
      card.innerHTML = `<strong>VultrPilot wants to act</strong><p>${escapeHtml(data.message || 'Review this browser action before it runs.')}</p><div class="meta">${escapeHtml(data.action || 'browser action')} · ${escapeHtml(data.url || '')}</div>`;
      const actions = document.createElement('div'); actions.className='approval-actions';
      const approve = document.createElement('button'); approve.type='button'; approve.textContent='Approve action';
      const deny = document.createElement('button'); deny.type='button'; deny.textContent='Don’t allow'; deny.className='deny';
      const respond = approved => { if (liveSocket?.readyState === WebSocket.OPEN) liveSocket.send(JSON.stringify({type:'approval', approved})); approve.disabled=true; deny.disabled=true; card.querySelector('p').textContent = approved ? 'Approved. Continuing…' : 'Not approved. No action was taken.'; };
      approve.addEventListener('click', () => respond(true)); deny.addEventListener('click', () => respond(false)); actions.append(approve, deny); card.appendChild(actions); messages.appendChild(card); messages.scrollTop = messages.scrollHeight;
    }

    function showLiveBrowser(data) {
      if (!liveBrowserCard) {
        liveBrowserCard = document.createElement('div'); liveBrowserCard.className = 'sidebar-browser';
        document.querySelector('#browser-sidebar').replaceChildren(liveBrowserCard);
      }
      const existingFrame = liveBrowserFrame;
      liveBrowserCard.innerHTML = `<div class="sidebar-title"><span>Live isolated browser</span><span class="sidebar-live">● live</span></div><div class="meta">${escapeHtml(data.phase || 'working')} · ${escapeHtml(data.title || 'Loading page')}</div>`;
      if (data.url) liveBrowserCard.innerHTML += `<div class="meta sidebar-url" title="${escapeHtml(data.url)}">${escapeHtml(data.url)}</div>`;
      if (existingFrame) liveBrowserCard.appendChild(existingFrame);
      if (data.screenshot_base64) {
        if (!liveBrowserFrame) { liveBrowserFrame = createAnnotatedFrame(data); liveBrowserCard.appendChild(liveBrowserFrame); }
        else liveBrowserFrame.updateScreenshot(data);
      }
    }


    function resetLiveBrowser() {
      liveBrowserCard = null;
      liveBrowserFrame = null;
      document.querySelector('#browser-sidebar').innerHTML = '<div class="sidebar-empty">Waiting for the next isolated browser screenshot…</div>';
    }

    function showBrowserAnalysis(data) {
      const point = data.point || {};
      const card = document.createElement('div'); card.className = 'event';
      const target = point.found ? `${point.tag || 'element'}${point.text ? ` · ${point.text}` : ''}` : 'No element found at the annotation';
      card.innerHTML = `<strong>AI image analysis</strong><br>${escapeHtml(data.message || 'Analyzed the annotation')}<div class="meta">Target: ${escapeHtml(target)}</div>`;
      if (point.href) card.innerHTML += `<div class="meta">${escapeHtml(point.href)}</div>`;
      messages.appendChild(card); messages.scrollTop = messages.scrollHeight;
    }

    function showVisionAnalysis(data) {
      const card = document.createElement('div'); card.className = 'event';
      card.innerHTML = `<strong>Vision verification</strong><div class="meta">${escapeHtml(data.model || 'Vultr vision model')}</div>${renderMarkdown(data.message || 'No visual analysis returned.')}`;
      messages.appendChild(card); messages.scrollTop = messages.scrollHeight;
    }

    function readHistory() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        const saved = Array.isArray(stored) ? stored : (stored.messages || []);
        return saved.filter(item => item && ['user', 'assistant'].includes(item.role) && item.text).slice(-30);
      } catch (_) { return []; }
    }

    function readStoredChat() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
        return Array.isArray(stored) ? {messages:stored, lastImage:null} : stored;
      } catch (_) { return {messages:[], lastImage:null}; }
    }

    function saveHistory() {
      const history = [...messages.querySelectorAll('.message')].map(row => ({
        role: row.classList.contains('user') ? 'user' : 'assistant',
        text: row.querySelector('.bubble')?.dataset.raw || row.querySelector('.bubble')?.textContent || '',
        image_data: row.querySelector('.chat-image')?.src || null,
        image_source_url: row.querySelector('.chat-image')?.dataset.sourceUrl || null,
        annotation: (() => { try { return row.querySelector('.chat-image')?.dataset.annotation ? JSON.parse(row.querySelector('.chat-image').dataset.annotation) : null; } catch (_) { return null; } })()
      }));

      html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>').replace(/^## (.+)$/gm, '<h2>$1</h2>').replace(/^# (.+)$/gm, '<h1>$1</h1>');
      html = html.replace(/^[-*] (.+)$/gm, '<li>$1</li>');
      html = html.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>');
      html = html.replace(/\*([^*\n]+)\*/g, '<em>$1</em>').replace(/_([^_\n]+)_/g, '<em>$1</em>');
      html = html.split(/\n{2,}/).map(block => /^<(?:h[1-3]|ul|pre|table)>/.test(block) ? block : `<p>${block.replace(/\n/g, '<br>')}</p>`).join('');
      codeBlocks.forEach((block, index) => { html = html.replace(`@@CODE${index}@@`, block); });
      return html;
    }

    function rowCells(row) {
      return row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
    }

    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

    form.addEventListener('submit', async (e) => {
      e.preventDefault(); const text = input.value.trim(); if ((!text && !selectedFiles.length) || send.disabled) return;
      const previousHistory = readHistory();
      const filesForUpload = [...selectedFiles];
      const userBubble = addMessage('user', text || `Attached ${filesForUpload.length} file${filesForUpload.length === 1 ? '' : 's'}`); input.value = ''; selectedFiles = []; filePicker.value = ''; renderSelectedFiles(); send.disabled = true; send.textContent = 'Working…';
      const thinking = addMessage('assistant', 'Planning your request…');
      activeThinking = thinking; resetLiveBrowser();
      thinking.classList.add('thinking');
      const statuses = ['Planning your request…', 'Opening the isolated browser…', 'Reading the page results…', 'Preparing the answer…'];
      let statusIndex = 0;
      const statusTimer = setInterval(() => {
        statusIndex = Math.min(statusIndex + 1, statuses.length - 1);
        thinking.textContent = statuses[statusIndex];
      }, 1800);
      try {
        const uploaded = [];
        for (const file of filesForUpload) { thinking.textContent = `Uploading ${file.name}…`; const uploadedFile = await uploadAttachment(file); uploaded.push(uploadedFile); showUploadedAttachment(userBubble, uploadedFile); }
        saveHistory();
        // Only images explicitly added to the current composer are sent.
        // Earlier browser images remain visible but are not reused.
        const pendingImages = [...messages.querySelectorAll('.chat-image[data-pending="true"]')];
        const annotations = pendingImages.map(image => {
          if (!image.dataset.annotation) return null;
          try { return {source_url:image.dataset.sourceUrl || '', image_data:image.src, annotation:JSON.parse(image.dataset.annotation)}; } catch (_) { return null; }
        }).filter(Boolean).slice(-5);
        const response = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({message:text || 'Please act on the attached annotation.', attachments:uploaded.map(file => ({id:file.id, name:file.name, content_type:file.content_type, size:file.size, url:file.url})), annotations, approval_mode:approvalMode.value, session_id:sessionId, history:previousHistory.map(item => ({role:item.role, content:item.text}))}) });
        const payload = await response.json(); if (!response.ok) throw new Error(payload.detail || 'The request failed.');
        pendingImages.forEach(image => { delete image.dataset.pending; });
        clearInterval(statusTimer); thinking.classList.remove('thinking');
        thinking.dataset.raw = payload.reply || 'Done.';
        thinking.innerHTML = renderMarkdown(payload.reply || 'Done.');
        (payload.events || []).forEach(event => addEvent(event, thinking));
        saveHistory();
        requestAnimationFrame(() => thinking.closest('.message')?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      } catch (error) { clearInterval(statusTimer); thinking.classList.remove('thinking'); thinking.textContent = `Sorry, I couldn’t complete that: ${error.message}`; thinking.dataset.raw = thinking.textContent; saveHistory(); }
      finally { activeThinking = null; send.disabled = false; send.textContent = 'Send'; input.focus(); }
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
    attach.addEventListener('click', () => filePicker.click());
    filePicker.addEventListener('change', () => { selectedFiles = [...filePicker.files].slice(0, 10); renderSelectedFiles(); });

    clear.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY); messages.innerHTML = '';
      resetLiveBrowser();
      renderHistoryList();
      messages.appendChild(empty || Object.assign(document.createElement('div'), {className:'empty', innerHTML:'<h1>What can I browse for you?</h1><p>VultrPilot uses Qwen and an isolated browser on your Vultr VM.</p>'}));
    });

    try {
      const stored = readStoredChat();
      stored.messages.forEach(item => { addMessage(item.role, item.text, false); if (item.image_data) addImageMessage(item.image_data, item.image_source_url || '', false, item.annotation || null); });
      if (stored.lastImage) addSavedImage(stored.lastImage);
    } catch (_) { localStorage.removeItem(STORAGE_KEY); }
    window.addEventListener('beforeunload', saveHistory);
    renderHistoryList();
    connectLiveUpdates();
  </script>
</body>
</html>
