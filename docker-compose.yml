services:
  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    ports:
      # Keep the application behind Caddy. The API is no longer exposed
      # directly to the public internet on port 8000.
      - "127.0.0.1:8000:8000"
    depends_on:
      - runner
      - executor
    volumes:
      - executor_jobs:/var/lib/vultrpilot-executor

  runner:
    build: ./runner
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp

  executor:
    build: ./executor
    restart: unless-stopped
    network_mode: none
    volumes:
      - executor_jobs:/var/lib/vultrpilot-executor
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  executor_jobs:
  caddy_data:
  caddy_config:

